<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogicPanel - PaaS Control Panel</title>
    <style>
        :root {
            --bg: #0f172a;
            --text: #e2e8f0;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --card-bg: #1e293b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 560px;
            width: 100%;
        }

        h1 {
            font-size: 2.25rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #f8fafc;
            letter-spacing: -0.5px;
        }

        p {
            color: #94a3b8;
            margin-bottom: 2rem;
            font-size: 1rem;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .link-card {
            background-color: var(--card-bg);
            padding: 1.25rem 1.5rem;
            border-radius: 0.5rem;
            text-decoration: none;
            color: var(--text);
            transition: background-color 0.15s ease, border-color 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #334155;
        }

        .link-card:hover {
            background-color: #263345;
            border-color: var(--primary);
        }

        .link-title {
            font-weight: 600;
            font-size: 1rem;
        }

        .icon {
            opacity: 0.6;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>LogicPanel</h1>
        <p>Lightweight PaaS Control Panel for Modern Web Hosting</p>

        <div class="links">
            <a href="https://github.com/cyber-wahid/logicpanel#readme" target="_blank" rel="noopener noreferrer" class="link-card">
                <span class="link-title">Documentation</span>
                <span class="icon">→</span>
            </a>

            <a href="https://github.com/cyber-wahid/logicpanel" target="_blank" rel="noopener noreferrer" class="link-card">
                <span class="link-title">GitHub Repository</span>
                <span class="icon">→</span>
            </a>

            <a href="#" id="master-link" class="link-card">
                <span class="link-title">Master Panel (Admin)</span>
                <span class="icon">→</span>
            </a>

            <a href="#" id="user-link" class="link-card">
                <span class="link-title">User Panel (Client)</span>
                <span class="icon">→</span>
            </a>
        </div>

        <p style="margin-top: 2rem; font-size: 0.8rem;">
            &copy;
            <script>document.write(new Date().getFullYear())</script> LogicPanel
        </p>
    </div>

    <script>
        // Dynamic Panel Links based on current domain
        const hostname = window.location.hostname;
        const protocol = window.location.protocol;
        const port = window.location.port ? ':' + window.location.port : '';

        // If accessed via port 80/443, assume standard panel ports
        // If on localhost development, use localhost

        // Master Panel is typically on port 9999
        document.getElementById('master-link').href = `${protocol}//${hostname}:9999`;

        // User Panel is typically on port 7777
        document.getElementById('user-link').href = `${protocol}//${hostname}:7777`;
    </script>
</body>

</html>
